<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070b14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>NCLEX Ward</title>
<style>
  :root { --bg:#070b14; --card:#fff6e8; --ink:#141c28; --muted:#7a8494; --go:#2ee59d; --hot:#ff4d6d; --gold:#ffd24d; --fs:16px; }
  html.fs-s { --fs:14px; } html.fs-m { --fs:16px; } html.fs-l { --fs:18px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#eef3ff; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden; font-size:var(--fs); }
  #app { height:100%; height:100dvh; display:flex; flex-direction:column; background:
    radial-gradient(1200px 400px at 50% -10%, #1a2a4a 0%, transparent 60%), var(--bg); }
  .hud {
    padding: calc(8px + env(safe-area-inset-top)) 12px 6px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .logo {
    border:0; background:transparent; color:#fff; font-weight:900; letter-spacing:.12em; font-size:.78rem; padding:8px 0;
  }
  .hud-stats { display:flex; gap:6px; align-items:center; }
  .xp, .chip {
    background:#121b2c; border:2px solid #2a3a56; padding:6px 8px; font-weight:800; font-size:.72rem; color:#fff;
  }
  .xp b, .chip b { color:var(--gold); }
  .chip.warn { border-color:#7a2a3a; background:#2a1218; }
  .chip.warn b { color:var(--hot); }
  .xpbar { height:6px; margin:0 12px 4px; background:#121b2c; border:2px solid #2a3a56; }
  .xpbar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),#fff1a8); transition:width .3s ease; }
  .mode-tag { text-align:center; font-size:.68rem; font-weight:800; letter-spacing:.14em; color:var(--gold); min-height:1em; }
  .stage { flex:1; position:relative; overflow:hidden; }
  .card { position:absolute; inset:0; padding:6px 12px 108px; display:flex; flex-direction:column; transition:transform .24s ease, opacity .24s ease; }
  .card.exit-up { transform:translateY(-110%); opacity:0; }
  .card.exit-down { transform:translateY(110%); opacity:0; }
  .card.enter-from-down { transform:translateY(110%); }
  .card.enter-from-up { transform:translateY(-110%); }
  .chart {
    background:var(--card); color:var(--ink); border:3px solid #000;
    box-shadow: 0 10px 0 #05070c; padding:12px; display:flex; flex-direction:column; min-height:0; flex:1;
  }
  .roomrow { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .qnum { font-weight:900; font-size:.78rem; letter-spacing:.08em; }
  .meta { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .tag { background:#141c28; color:#fff; font-size:.64rem; font-weight:800; padding:4px 7px; letter-spacing:.04em; }
  .tag.easy { background:#1f7a4a; } .tag.med { background:#c46b00; } .tag.hard { background:#c21d3a; }
  .case { background:#efe4cc; padding:8px; font-size:.82rem; line-height:1.35; white-space:pre-wrap; max-height:18%; overflow:auto; margin-bottom:8px; }
  .stem { margin:0 0 10px; font-size:1.06rem; line-height:1.32; font-weight:800; max-height:28%; overflow:auto; }
  .opts { display:flex; flex-direction:column; gap:8px; overflow:auto; flex:1; }
  .opt { width:100%; text-align:left; border:3px solid #141c28; background:#fff; color:var(--ink); padding:0; font-size:.92rem; line-height:1.3; display:grid; grid-template-columns:42px 1fr; font-weight:700; }
  .opt .ltr { background:#141c28; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; }
  .opt span:last-child { padding:11px; }
  .opt.selected { background:#ffe08a; }
  .opt.correct { background:#b6ffd4; }
  .opt.wrong { background:#ffc1cc; }
  .why { display:none; margin-top:8px; background:#141c28; color:#fff; padding:8px 10px; font-size:.82rem; line-height:1.4; max-height:24%; overflow:auto; }
  .why.show { display:block; } .why .nx { color:#ffd24d; margin-top:6px; }
  .dock {
    position:absolute; left:0; right:0; bottom:0; z-index:6;
    padding:8px 10px calc(12px + env(safe-area-inset-bottom));
    background:#05070c; border-top:3px solid var(--gold);
    display:grid; grid-template-columns:72px 1fr 72px; gap:8px;
  }
  .btn { border:0; padding:16px 8px; font-weight:900; cursor:pointer; }
  .btn.main { background:var(--go); color:#062318; font-size:1.12rem; letter-spacing:.06em; box-shadow:0 5px 0 #14865a; }
  .btn.ghost { background:#1a2438; color:#fff; font-size:.78rem; }
  .handle, .hint { display:none; }
  .flash { position:absolute; inset:0; pointer-events:none; z-index:4; }
  .flash.good { background:#2ee59d22; } .flash.bad { background:#ff4d6d22; }
  .toast { position:absolute; top:16%; left:50%; transform:translateX(-50%); background:var(--gold); color:#141c28; padding:10px 16px; z-index:9; font-weight:900; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .pop { animation:pop .35s ease; }
  @keyframes pop { 0%{transform:scale(.86)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .gate, .sheet, .debrief, .field {
    position:absolute; inset:0; z-index:8; overflow:auto;
    padding:calc(22px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(#15233f,#070b14);
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .gate h1, .sheet h2, .debrief h2, .field h2 { margin:0 0 8px; font-size:2.1rem; }
  .muted { color:#9aa6b8; line-height:1.4; margin:0 0 14px; }
  .choice { display:grid; gap:8px; margin-bottom:12px; }
  .choice button { text-align:left; background:#162238; color:#fff; border:3px solid #2a3d5c; padding:14px; }
  .choice button.active { border-color:var(--go); background:#113326; }
  .choice b { display:block; font-size:1.08rem; }
  .choice span { color:#9aa6b8; font-size:.82rem; }
  .hidden { display:none !important; }
  .live { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  .fine { font-size:.72rem; color:#7d8796; }
  .roomlist { display:grid; gap:6px; margin:0 0 12px; }
  .roomlist button { text-align:left; background:var(--card); color:var(--ink); border:0; padding:12px; font-weight:700; }
  .roomlist button em { display:block; font-style:normal; font-size:.75rem; color:#5b6472; margin-top:3px; }
  .roomlist button.ok { background:#b6ffd4; }
  .roomlist button.bad { background:#ffc1cc; }
  .lanes { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin:0 0 12px; }
  .lane { border:3px solid #2a3d5c; background:#162238; color:#fff; padding:12px; text-align:left; }
  .lane.active { border-color:var(--gold); background:#3a2e10; }
  .lane b { display:block; }
  .who { display:none; }
  .fonts { display:flex; gap:8px; margin-bottom:10px; }
  .fonts button { flex:1; background:#162238; color:#fff; border:2px solid #2a3d5c; padding:8px; }
  .fonts button.active { border-color:var(--gold); }
  .kicker { color:var(--gold); font-weight:800; letter-spacing:.12em; font-size:.72rem; text-transform:uppercase; margin:0 0 6px; }
  .miss-list { margin:0 0 12px; color:#d7deea; }
  .statrow { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:0 0 16px; }
  .stat { background:#162238; border:2px solid #2a3d5c; padding:12px 8px; text-align:center; }
  .stat b { display:block; font-size:1.3rem; color:var(--gold); }
  .stat span { font-size:.7rem; color:#9aa6b8; }
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <button class="logo" id="menuBtn" type="button">WARD</button>
    <div class="hud-stats">
      <div class="xp" id="lvlChip">LV 1</div>
      <div class="xp">🔥 <b id="streak">0</b></div>
      <div class="xp">⭐ <b id="score">0</b></div>
      <button class="chip warn" id="missChip" type="button">MISS <b id="missCount">0</b></button>
    </div>
  </div>
  <div class="xpbar"><i id="xpFill"></i></div>
  <div class="mode-tag" id="modeTag"></div>
  <div class="stage" id="stage">
    <div class="card" id="card"></div>
    <div class="hint hidden" id="hint"></div>
    <div class="flash" id="flash"></div>
    <div class="handle" id="handle"><i></i></div>
  </div>
  <div class="dock" id="dock">
    <button class="btn ghost" id="backBtn" type="button">BACK</button>
    <button class="btn main" id="mainBtn" type="button">CHECK</button>
    <button class="btn ghost" id="meBtn" type="button">ME</button>
  </div>
  <div class="toast" id="toast"></div>
  <div class="live" id="live" aria-live="polite"></div>

  <div class="gate hidden" id="gate">
    <p class="kicker">One tap to start</p>
    <h1>Play NCLEX.</h1>
    <p class="muted">Pick an answer. Hit CHECK. Then NEXT. Wrong ones save themselves so you can replay them later.</p>
    <div class="choice">
      <button id="pickRN" type="button"><b>RN</b><span>Registered nurse</span></button>
      <button id="pickPN" type="button"><b>PN</b><span>Practical / vocational nurse</span></button>
    </div>
    <input id="nurseName" class="hidden" maxlength="24">
    <button class="btn main" id="startBtn" type="button">PLAY</button>
  </div>

  <div class="sheet hidden" id="menu">
    <h2>More</h2>
    <p class="muted" id="menuCopy"></p>
    <p class="kicker">Text size</p>
    <div class="fonts" id="fonts">
      <button type="button" data-fs="s">A-</button>
      <button type="button" data-fs="m">A</button>
      <button type="button" data-fs="l">A+</button>
    </div>
    <div class="choice">
      <button type="button" id="modeMix"><b>Keep playing</b><span>Endless mix</span></button>
      <button type="button" id="modeShift"><b>Quick 20</b><span>Short run, then a score</span></button>
      <button type="button" id="modeCase"><b>Story</b><span>One patient, 6 questions</span></button>
      <button type="button" id="switchTrack"><b>Switch RN / PN</b></button>
    </div>
    <div id="casePick" class="choice hidden"></div>
    <p class="fine">Practice only. Not NCSBN.</p>
    <button class="btn main" id="closeMenu" type="button">CLOSE</button>
  </div>

  <div class="debrief hidden" id="debrief"></div>
  <div class="field hidden" id="field"></div>
</div>
<script src="labels.js"></script>
<script src="b0.js"></script>
<script src="b9.js"></script>
<script src="b-now.js"></script>
<script src="bank.js"></script>
<script src="app.js"></script>
</body>
</html>
